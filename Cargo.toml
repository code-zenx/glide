[package]
name = "glide"
version = "0.1.0"
edition = "2021"
description = "Share one keyboard and mouse between a Mac and a Linux box over the LAN"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
# getifaddrs, for the addresses an invite lists; CLOCK_MONOTONIC on Linux.
libc = "0.2"
futures = "0.3"
# Only the backends these machines actually use: libei on Hyprland, X11 on
# nullbyte's Xfce, macOS natively. The remote-desktop portal is dead weight.
# Forked: upstream puts a capture barrier on the union of every display, so a
# peer can only sit off the outermost screen. vendor/ adds a per-display
# barrier. See vendor/input-capture/GLIDE-CHANGES.md.
input-capture = { path = "vendor/input-capture", default-features = false, features = ["libei", "layer_shell", "x11"] }
input-emulation = { version = "0.4", default-features = false, features = ["wlroots", "libei", "x11"] }
input-event = "0.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Reads and writes the clipboard by MIME type, so an image crosses as the bytes
# it already is instead of a decoded bitmap.
wl-clipboard-rs = "0.9"
# The receiving end of an extended display: hardware decode straight to a
# Wayland surface, no copies through this process.
gstreamer = "0.25"
gstreamer-app = "0.25"
# View Screen's capture on Hyprland: wlr-screencopy into shared memory. Pinned
# to what input-emulation already pulls in, so nothing new is fetched.
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
# The sending end of an extended display: a virtual screen, captured without
# copies and encoded on the media engine.
dispatch2 = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-video-toolbox = "0.3"

[profile.release]
# A small, quick binary matters more here than fast rebuilds: this runs all day.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
